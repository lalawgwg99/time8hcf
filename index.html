        // --- WLB 健康度計算 ---
        function calculateWLB(result) {
            let score = 100;
            const hours = result.total / 60;
            const target = 8;

            // 1. 工時評分
            if (hours > 9) score -= (hours - 9) * 10; // 加班扣分
            else if (hours < 4 && hours > 0) score -= (4 - hours) * 5; // 太短也扣分(薪水小偷?)

            // 2. 休息評分
            // 檢查是否有連續工作超過 4 小時
            let maxContinuous = 0;
            for (let i = 0; i < punchRecords.length - 1; i += 2) {
                const diff = (new Date(punchRecords[i + 1].time) - new Date(punchRecords[i].time)) / 60000 / 60;
                if (diff > maxContinuous) maxContinuous = diff;
            }
            // 檢查當前進行中
            if (punchRecords.length % 2 !== 0) {
                const currentDiff = (new Date() - new Date(punchRecords[punchRecords.length - 1].time)) / 60000 / 60;
                if (currentDiff > maxContinuous) maxContinuous = currentDiff;
            }

            if (maxContinuous > 4) score -= (maxContinuous - 4) * 15; // 沒休息扣重分

            // 3. 限制範圍
            score = Math.max(0, Math.min(100, Math.round(score)));

            // 4. 等級判定
            let level = "";
            let tag = "";
            let color = "";
            let comment = "";

            if (score >= 90) {
                level = "自由人 (Free Man)"; tag = "S級"; color = "text-ios-green";
                comment = "完美的工作節奏，令人羨慕！";
            } else if (score >= 80) {
                level = "優良員工"; tag = "A級"; color = "text-ios-blue";
                comment = "表現良好，繼續保持。";
            } else if (score >= 60) {
                level = "標準社畜"; tag = "B級"; color = "text-yellow-500";
                comment = "有點累了嗎？記得休息一下。";
            } else if (score >= 40) {
                level = "加班戰士"; tag = "C級"; color = "text-orange-500";
                comment = "你的肝在哭泣，快點下班吧。";
            } else {
                level = "地縛靈"; tag = "D級"; color = "text-ios-red";
                comment = "你還記得家裡的樣子嗎？";
            }

            return { score, level, tag, color, comment };
        }

        function formatTime(isoString) {

        function formatDurationFancy(minutes) {

        function calculateHours() {
            let totalMinutes = 0;
            const sessions = [];
            const len = punchRecords.length;

            for (let i = 0; i < len - (len % 2); i += 2) {
                const diff = (new Date(punchRecords[i + 1].time) - new Date(punchRecords[i].time)) / 60000;
                if (diff > 0) {
                    totalMinutes += diff;
                    sessions.push({ start: formatTime(punchRecords[i].time), end: formatTime(punchRecords[i + 1].time), duration: diff });
                }
            }

            let isOngoing = false;
            if (len % 2 !== 0) {
                const currentDiff = (new Date() - new Date(punchRecords[len - 1].time)) / 60000;
                if (currentDiff > 0) {
                    totalMinutes += currentDiff;
                    isOngoing = true;
                    sessions.push({ start: formatTime(punchRecords[len - 1].time), end: '現在', duration: currentDiff });
                }
            }
            return { total: totalMinutes, sessions: sessions, isOngoing: isOngoing };
        }

                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full ${isIn ? 'bg-green-100 text-ios-green' : 'bg-orange-100 text-ios-orange'} flex items-center justify-center text-xs">
                                <i class="fas ${isIn ? 'fa-arrow-right' : 'fa-arrow-left'}"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[15px] font-medium text-gray-900">${isIn ? '開始工作' : '結束工作'}</span>
                                ${record.task ? `<span class="text-[11px] text-gray-500 truncate max-w-[150px]">${record.task}</span>` : ''}
                            </div>
                        </div>
                        <span class="text-[15px] font-mono text-gray-500">${formatTime(record.time)}</span>
                    `;
                    listContainer.appendChild(div);
                });
            }

            // --- Session List ---
            const sessionContainer = document.getElementById('workSessions');
            const sessionParent = document.getElementById('workSessionsContainer');

            if (result.sessions.length > 0) {
                sessionParent.classList.remove('hidden');
                sessionContainer.innerHTML = '';
                // 倒序顯示
                [...result.sessions].reverse().forEach((session, i) => {
                    const div = document.createElement('div');
                    div.className = "py-3 pr-4 flex justify-between items-center";
                    const durObj = formatDurationFancy(session.duration);

                    div.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-[13px] font-semibold text-gray-900">工作時段 ${result.sessions.length - i}</span>
                            <span class="text-[11px] text-gray-500">${session.start} - ${session.end}</span>
                        </div>
                        <span class="text-[13px] font-medium text-gray-900 bg-gray-100 px-2 py-1 rounded-md">
                            ${durObj.h}h ${Math.round(durObj.m)}m
                        </span>
                   `;
                    sessionContainer.appendChild(div);
                });
                document.getElementById('insightBtn').removeAttribute('disabled');
            } else {
                sessionParent.classList.add('hidden');
            }

            // Undo 按鈕狀態
            document.getElementById('undoBtn').disabled = punchRecords.length === 0;

            // Clear 按鈕狀態 (如果正在確認中，重置它)
            if (punchRecords.length === 0) {
                const clearBtn = document.getElementById('clearBtn');
                clearBtn.classList.add('hidden');
            } else {
                document.getElementById('clearBtn').classList.remove('hidden');
            }
        }

        // Initialize
        loadData();
        renderCalendar();
        updateDisplay();
        updateCurrentTime();

        setInterval(updateDisplay, 10000);

        setInterval(updateCurrentTime, 1000);


    </script>
</body>

</html>
